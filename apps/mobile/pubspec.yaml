name: amar_fe_mobile
description: "AMar Fe / ToLove Faith - Mobile Apps for Customers & Couriers"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Backend & Network (Decoupled with Repository pattern)
  supabase_flutter: ^2.5.0
  dio: ^5.4.3

  # State Management & Service Locator
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5
  get_it: ^7.7.0

  # Geo & Maps
  google_maps_flutter: ^2.6.0
  geolocator: ^11.0.0

  # Storage & Utilities
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
